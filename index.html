<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <section class="header">
    <h1>Jogo da memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>
  </section>

  <section class="memory-game">

    <!-- mortis -->
    <section class="memory-card" data-framework="mortis">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/mortis.jpg" alt="mortis">
    </section>

    <!-- pam -->
    <section class="memory-card" data-framework="pam">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/pam.jpg" alt="pam">
    </section>

     <!-- shelly -->
     <section class="memory-card" data-framework="shelly">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/shelly.jpg" alt="shelly">
    </section>

    <!-- buzz -->
    <section class="memory-card" data-framework="buzz">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/buzz.jpg" alt="buzz">
    </section>

     <!-- el primo -->
     <section class="memory-card" data-framework="el primo">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/el primo.jpg" alt="el primo">
    </section>

    <!-- penny -->
    <section class="memory-card" data-framework="penny">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/penny.jpg" alt="penny">
    </section>
    
    <!-- shelly -->
    <section class="memory-card" data-framework="shelly">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/shelly.jpg" alt="shelly">
    </section>

    <!-- penny -->
    <section class="memory-card" data-framework="penny">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/penny.jpg" alt="penny">
    </section>

    <!-- mortis -->
    <section class="memory-card" data-framework="mortis">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/mortis.jpg" alt="mortis">
    </section>

    <!-- pam -->
    <section class="memory-card" data-framework="pam">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/pam.jpg" alt="pam">
    </section>

    <!-- el primo -->
    <section class="memory-card" data-framework="el primo">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/el primo.jpg" alt="el primo">
    </section>

    <!-- buzz -->
    <section class="memory-card" data-framework="buzz">
      <img class="front-face" src="img/brawl.jpg" alt="brawl">
      <img class="back-face" src="img/buzz.jpg" alt="buzz">
    </section>

  </section>

  <script src="js/scripts.js"></script>

</body>
</html>
